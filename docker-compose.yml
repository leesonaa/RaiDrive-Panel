services:
  raidrive-panel:
    image: leesonaa/raidrive-panel:latest
    container_name: raidrive-panel
    labels:
      net.unraid.docker.icon: "https://docs.raidrive.com/en/cli/images/RaiDrive.png"
      net.unraid.docker.webui: "http://[IP]:[PORT:3030]"

    restart: unless-stopped
    network_mode: bridge

    ports:
      - "${PANEL_PORT:-3030}:3030"

    # Required for FUSE filesystem inside the container
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined

    # Unraid-friendly persistent paths under /mnt/user/appdata
    volumes:
      - /mnt/user/appdata/raidrive-panel/config:/etc/raidrive
      - /mnt/user/appdata/raidrive-panel/cache:/var/cache/raidrive
      - /mnt/user/appdata/raidrive-panel/logs:/var/log/raidrive
      # File sync: map every local directory you want to sync into the container.
      # (sync jobs and their state live in /etc/raidrive/panel, i.e. the config volume above)
      # - /mnt/user/photos:/data/photos
      # Optional: expose mounted filesystems to host/share
      # - /mnt/user/raidrive:/mnt:shared

    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PORT=3030
      # Directories (inside the container) the file manager may browse, besides the RaiDrive mounts.
      - FS_ROOTS=/mnt:/data:/media
      # Strongly recommended: the panel can read, write and delete files.
      # - PANEL_USER=admin
      # - PANEL_PASSWORD=change-me
